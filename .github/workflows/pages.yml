name: Deploy LUMEN to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          GITHUB_PAGES: 'true'
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Verify public Pages HTML and hashed assets
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          page="${PAGE_URL%/}/?build=${GITHUB_SHA}"
          html=""

          for attempt in 1 2 3 4 5 6; do
            if html="$(curl -fsSL --retry 2 --retry-delay 2 "$page")"; then
              break
            fi
            echo "Waiting for Pages propagation (attempt $attempt/6)…"
            sleep 10
          done

          test -n "$html"
          printf '%s' "$html" | grep -q 'LUMEN — Digital Museum of Visual Culture'

          script_path="$(printf '%s' "$html" | grep -oE 'src="[^"]+\.js"' | head -1 | cut -d'"' -f2)"
          style_path="$(printf '%s' "$html" | grep -oE 'href="[^"]+\.css"' | head -1 | cut -d'"' -f2)"
          origin="$(printf '%s' "$PAGE_URL" | sed -E 's#(https?://[^/]+).*#\1#')"

          test -n "$script_path"
          test -n "$style_path"
          curl -fsS "$origin$script_path" -o /dev/null
          curl -fsS "$origin$style_path" -o /dev/null

          echo "Verified $PAGE_URL"
          echo "JS: $script_path"
          echo "CSS: $style_path"
